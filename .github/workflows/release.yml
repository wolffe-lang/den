name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  gate:
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/release-gate.yml
  draft:
    needs: gate
    permissions:
      contents: write
    uses: wolffe-lang/homebrew-wolf/.github/workflows/tool-release.yml@dc1758c155c7d83d6303f74013bca1a6d8175a9f
    with:
      config: .github/release.json
      infrastructure-revision: dc1758c155c7d83d6303f74013bca1a6d8175a9f
      tested-sha: ${{ needs.gate.outputs.tested-sha }}
