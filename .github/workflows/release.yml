name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  gate:
    permissions:
      contents: read
    uses: ./.github/workflows/release-gate.yml
  draft:
    needs: gate
    permissions:
      contents: write
    uses: wolffe-lang/homebrew-wolf/.github/workflows/tool-release.yml@86a927a61bada609eb64f7da982530962af129c8
    with:
      config: .github/release.json
      infrastructure-revision: 86a927a61bada609eb64f7da982530962af129c8
      tested-sha: ${{ needs.gate.outputs.tested-sha }}
