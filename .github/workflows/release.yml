name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  gate:
    permissions:
      contents: read
    uses: ./.github/workflows/release-gate.yml
  draft:
    needs: gate
    permissions:
      contents: write
    uses: wolffe-lang/homebrew-wolf/.github/workflows/tool-release.yml@577f7a89114c38d555da813fbe34ca1b5e8afd84
    with:
      config: .github/release.json
      infrastructure-revision: 577f7a89114c38d555da813fbe34ca1b5e8afd84
      tested-sha: ${{ needs.gate.outputs.tested-sha }}
