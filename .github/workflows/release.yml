name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  gate:
    permissions:
      contents: read
    uses: ./.github/workflows/release-gate.yml
  draft:
    needs: gate
    permissions:
      contents: write
    uses: wolffe-lang/homebrew-wolf/.github/workflows/tool-release.yml@45f3bd27f8e26a54af5eced64c759396bdf1f850
    with:
      config: .github/release.json
      infrastructure-revision: 45f3bd27f8e26a54af5eced64c759396bdf1f850
      tested-sha: ${{ needs.gate.outputs.tested-sha }}
