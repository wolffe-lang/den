name: public release smoke
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Already published stable tag to verify anonymously
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify:
    uses: wolffe-lang/homebrew-wolf/.github/workflows/tool-public-smoke.yml@9c8810c7abac18e0067cfbf3bc975aff0d56d21f
    with:
      tag: ${{ inputs.tag }}
      config: .github/release.json
      infrastructure-revision: 9c8810c7abac18e0067cfbf3bc975aff0d56d21f
