name: public release smoke
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Already published stable tag to verify anonymously
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify:
    uses: wolffe-lang/homebrew-wolf/.github/workflows/tool-public-smoke.yml@577f7a89114c38d555da813fbe34ca1b5e8afd84
    with:
      tag: ${{ inputs.tag }}
      config: .github/release.json
      infrastructure-revision: 577f7a89114c38d555da813fbe34ca1b5e8afd84
