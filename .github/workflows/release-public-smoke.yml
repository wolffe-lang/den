name: public release smoke
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Already published stable tag to verify anonymously
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify:
    uses: wolffe-lang/homebrew-wolf/.github/workflows/tool-public-smoke.yml@86a927a61bada609eb64f7da982530962af129c8
    with:
      tag: ${{ inputs.tag }}
      config: .github/release.json
      infrastructure-revision: 86a927a61bada609eb64f7da982530962af129c8
